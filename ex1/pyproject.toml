[tool.poetry]
name = "loading-programs"
version = "0.1.0"
description = "Matrix-style data analysis exercise demonstrating pip and Poetry"
authors = ["davgarc4"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
numpy = "1.26.4"
pandas = "2.2.2"
matplotlib = "3.8.4"
requests = "2.31.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
